{{- /* Renders pages like the Advent of Code calendar: one row per entry, with a star. */ -}}
{{- if . }}
<ul class="calendar">
  {{- range . }}
  <li>
    <a href="{{ .RelPermalink }}">
      {{- if not .Date.IsZero }}<span class="calendar-date">{{ .Date.Format "2006-01-02" }}</span>{{ end -}}
      <span class="calendar-title">{{ .Title }}</span>
      <span class="calendar-star">*</span>
    </a>
  </li>
  {{- end }}
</ul>
{{- else }}
<p class="dim">{{ i18n "noPosts" }}</p>
{{- end }}
