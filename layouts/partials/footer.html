<footer>
  <p>
    {{- range site.Params.social_media.items }}{{ if .enabled }}
    <a href="{{ .link }}" target="_blank" rel="noopener">[{{ .title }}]</a>
    {{- end }}{{ end }}
    {{- with site.Params.author.email }}
    <a href="mailto:{{ . }}">[Email]</a>
    {{- end }}
  </p>
  <p>
    &copy; {{ now.Format "2006" }} &middot; {{ i18n "madeBy" }} {{ site.Copyright }}
    {{ i18n "madeWith" }} <a href="https://gohugo.io" target="_blank" rel="noopener">Hugo</a>
  </p>
</footer>
